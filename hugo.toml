theme = 'stack'
baseURL = 'https://samcui.com/'
title = 'SamCui Computing'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
hasCJKLanguage = true
enableRobotsTXT = true

[params]
description = "崔竞宁的个人网站 | Samuel N Cui's Website"
author = 'Samuel N Cui'
seoTitle = "SamCui Computing - 崔竞宁的个人网站 | Samuel N Cui's Website"

[params.giscus]
enabled = true
repo = 'samuelncui/blog'
repoId = 'R_kgDOVTJ05A'
category = 'Announcements'
categoryId = 'DIC_kwDOVTJ05M4DJUPP'

[permalinks.page]
post = '/post/:slug/'
posts = '/post/:slug/'

[taxonomies]
category = 'categories'
tag = 'tags'

[outputs]
home = ['HTML', 'RSS', 'LegacySitemapIndex', 'PostSitemap', 'PageSitemap', 'CategorySitemap']
section = ['HTML', 'RSS']
taxonomy = ['HTML', 'RSS']
term = ['HTML', 'RSS']

# Imported HTML is sanitized and reviewed before entering this repository.
[security]
allowContent = ['text/markdown', 'text/html']

[pagination]
pagerSize = 10

[outputFormats.LegacySitemapIndex]
mediaType = 'application/xml'
baseName = 'sitemap_index'
isPlainText = true
notAlternative = true

[outputFormats.PostSitemap]
mediaType = 'application/xml'
baseName = 'post-sitemap'
isPlainText = true
notAlternative = true

[outputFormats.PageSitemap]
mediaType = 'application/xml'
baseName = 'page-sitemap'
isPlainText = true
notAlternative = true

[outputFormats.CategorySitemap]
mediaType = 'application/xml'
baseName = 'category-sitemap'
isPlainText = true
notAlternative = true

[params.sidebar]
avatar = 'img/avatar.jpg'
subtitle = "崔竞宁的个人网站 | Samuel N Cui's Website"

[params.dateFormat]
published = '2006年1月2日'
lastUpdated = '2006年1月2日'

[params.article]
readingTime = true
toc = true

[params.widgets]
homepage = [{ type = 'categories' }, { type = 'tag-cloud' }]
page = [{ type = 'toc' }]

[params.colorScheme]
toggle = true
default = 'auto'


[languages.zh]
